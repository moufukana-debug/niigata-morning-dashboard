<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d8c4ad" />
    <title>朝の業務スタート画面 | 新潟県少年自然の家</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <script src="./src/app.js" type="module"></script>
  </head>
  <body>
    <main class="app-shell" aria-label="朝の業務スタート画面">
      <section class="hero card glass" aria-labelledby="today-title">
        <div>
          <p class="eyebrow">Niigata Morning</p>
          <h1 id="today-title">朝の業務スタート画面</h1>
          <p class="hero__date" id="today-label">今日の日付を確認中...</p>
        </div>
        <div class="person-chip" aria-label="対象職員">西村</div>
      </section>

      <section class="card setup-card" aria-labelledby="setup-title">
        <div class="section-heading">
          <span class="step-badge">準備</span>
          <div>
            <h2 id="setup-title">資料を読み込む</h2>
            <p>勤務予定表PDFと調整プログラムExcelを選ぶと、今日の情報だけ表示します。</p>
          </div>
        </div>
        <div class="file-grid">
          <label class="file-picker">
            <span>勤務予定表PDF</span>
            <input id="pdf-input" type="file" accept="application/pdf,.pdf" />
            <small id="pdf-status">未読み込み</small>
          </label>
          <label class="file-picker">
            <span>調整プログラムExcel</span>
            <input id="excel-input" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" />
            <small id="excel-status">未読み込み</small>
          </label>
        </div>
        <label class="date-control">
          <span>確認する日付</span>
          <input id="date-input" type="date" />
        </label>
      </section>

      <section class="card priority-card" aria-labelledby="work-title">
        <div class="section-heading compact">
          <span class="step-badge primary">まず見る</span>
          <h2 id="work-title">今日の勤務</h2>
        </div>
        <div id="work-summary" class="summary-box empty-state">PDFを読み込むと、西村さんの勤務情報を表示します。</div>
      </section>

      <section class="card attention-card" aria-labelledby="attention-title">
        <div class="section-heading compact">
          <span class="step-badge warn">注意</span>
          <h2 id="attention-title">注意点</h2>
        </div>
        <ul id="attention-list" class="attention-list">
          <li>資料未読み込みのため要確認</li>
        </ul>
      </section>

      <section class="card" aria-labelledby="tasks-title">
        <div class="section-heading compact">
          <span class="step-badge">3つだけ</span>
          <h2 id="tasks-title">最初にやること</h2>
        </div>
        <div id="task-list" class="task-list"></div>
      </section>

      <section class="card" aria-labelledby="events-title">
        <div class="section-heading compact">
          <span class="step-badge">団体</span>
          <h2 id="events-title">今日の団体・行事</h2>
        </div>
        <div id="events-list" class="events-list empty-state">Excelを読み込むと、今日の団体・活動を表示します。</div>
      </section>

      <section class="card" aria-labelledby="basic-title">
        <div class="section-heading compact">
          <span class="step-badge">基本</span>
          <h2 id="basic-title">今日の基本情報</h2>
        </div>
        <dl id="basic-info" class="info-list"></dl>
      </section>

      <section class="card memo-card" aria-labelledby="memo-title">
        <div class="section-heading compact">
          <span class="step-badge">メモ</span>
          <h2 id="memo-title">ひとことメモ</h2>
        </div>
        <textarea id="memo" rows="5" placeholder="例：朝礼で確認すること、気になったこと"></textarea>
        <p class="save-note" id="memo-status">入力すると自動保存します。</p>
      </section>
    </main>
  </body>
</html>
